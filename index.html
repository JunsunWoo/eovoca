<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="어원보카">
<meta name="theme-color" content="#f5f6f2" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#111312" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-192.png">
<title>어원보카 매일 학습</title>
<style>
  :root {
    --bg: #f5f6f2; --surface: #ffffff; --surface2: #eef0ea; --text: #1b1d1c; --muted: #6b6f6c; --line: #e3e6df;
    --accent: #13795b; --accent-soft: #e2f3ec; --blue: #2b59c3; --blue-soft: #e8eefb; --red: #c93c3c; --red-soft: #fbe9e9;
    --amber: #a86a0c; --amber-soft: #fbf1df; --green: #1f8a4c; --green-soft: #e2f4e9;
    --shadow: 0 1px 2px rgba(0,0,0,.04), 0 4px 14px rgba(0,0,0,.04);
    --r: 18px; --tabh: 58px; color-scheme: light;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #111312; --surface: #1b1e1d; --surface2: #282c2a; --text: #f1f3f2; --muted: #9aa09d; --line: #2d3230;
      --accent: #4fd1a3; --accent-soft: #173a2e; --blue: #7ea2ff; --blue-soft: #1f2a46; --red: #ff7b7b; --red-soft: #3a1c1c;
      --amber: #f0b45a; --amber-soft: #3a2d16; --green: #4cc47e; --green-soft: #173324; --shadow: none; color-scheme: dark;
    }
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--bg); color: var(--text); }
  body { font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", Pretendard, "Noto Sans KR", "Malgun Gothic", sans-serif; -webkit-text-size-adjust: 100%; -webkit-tap-highlight-color: transparent; padding-bottom: calc(var(--tabh) + env(safe-area-inset-bottom) + 72px); word-break: keep-all; overflow-wrap: anywhere; }
  body.no-tabs { padding-bottom: 32px; }
  a { color: inherit; text-decoration: none; }
  button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; }
  select, input { font: inherit; color: inherit; }
  svg { display: block; }
  #app { max-width: 640px; margin: 0 auto; padding: calc(env(safe-area-inset-top) + 10px) 16px 16px; }
  h1 { font-size: 30px; line-height: 1.2; margin: 2px 0 10px; letter-spacing: -.02em; }
  h2 { font-size: 17px; margin: 0; letter-spacing: -.01em; }
  .top { padding: 6px 2px 2px; }
  .top .date { color: var(--muted); font-size: 14px; font-weight: 600; }
  .muted { color: var(--muted); } .sm { font-size: 13px; }
  .label { color: var(--muted); font-size: 13px; font-weight: 600; }
  .big { font-size: 34px; font-weight: 800; letter-spacing: -.02em; line-height: 1.1; margin-top: 4px; }
  .big small { font-size: 16px; font-weight: 700; margin-left: 2px; color: var(--muted); }
  .row { display: flex; align-items: center; gap: 8px; }
  .between { justify-content: space-between; }
  .card { background: var(--surface); border-radius: var(--r); padding: 16px; margin: 12px 0; box-shadow: var(--shadow); }
  .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin: 12px 0; }
  .grid2 .card { margin: 0; }
  .tile { display: block; text-align: left; width: 100%; }
  .hint { color: var(--muted); font-size: 13px; margin: 10px 0 0; line-height: 1.5; }
  .empty { text-align: center; color: var(--muted); padding: 40px 0; }

  .btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; min-height: 44px; padding: 0 16px; border-radius: 13px; background: var(--surface2); font-weight: 650; font-size: 16px; white-space: nowrap; }
  .btn.sm { min-height: 34px; padding: 0 12px; font-size: 14px; border-radius: 10px; }
  .btn.primary { background: var(--accent); color: #fff; }
  .btn.block { display: flex; width: 100%; margin-top: 14px; }
  .btn.on { background: var(--accent-soft); color: var(--accent); }
  .btn.danger { color: var(--red); }
  .btn.done { background: var(--green-soft); color: var(--green); }
  .btn:active, .opt:active, .tile:active, .drow:active { transform: scale(.985); }
  .btn:disabled { opacity: .45; }
  .play { width: 38px; height: 38px; border-radius: 50%; background: var(--accent-soft); color: var(--accent); display: grid; place-items: center; flex-shrink: 0; }
  .play svg { width: 16px; height: 16px; margin-left: 2px; }
  .play.lg { width: 56px; height: 56px; } .play.lg svg { width: 22px; height: 22px; }
  .play.sm { width: 30px; height: 30px; } .play.sm svg { width: 12px; height: 12px; }
  .icon-btn { width: 36px; height: 36px; display: grid; place-items: center; border-radius: 50%; color: var(--muted); flex-shrink: 0; }
  .icon-btn svg { width: 20px; height: 20px; }
  .icon-btn.on { color: var(--amber); }
  .playing { background: var(--accent-soft) !important; }

  .hero { display: flex; justify-content: space-between; align-items: center; gap: 12px; }
  .week { display: flex; gap: 6px; }
  .week .d { display: flex; flex-direction: column; align-items: center; gap: 5px; font-size: 11px; color: var(--muted); font-weight: 600; }
  .week .d i { width: 22px; height: 22px; border-radius: 50%; background: var(--surface2); display: block; }
  .week .d.on i { background: var(--accent); }
  .week .d.today span { color: var(--text); }
  .bar { height: 8px; background: var(--surface2); border-radius: 4px; overflow: hidden; margin: 10px 0 4px; }
  .bar i { display: block; height: 100%; background: var(--accent); border-radius: 4px; }

  /* DAY 목록 */
  .days { display: grid; grid-template-columns: repeat(5, 1fr); gap: 8px; margin-top: 10px; }
  .dcell { aspect-ratio: 1; border-radius: 14px; background: var(--surface2); display: flex; flex-direction: column; align-items: center; justify-content: center; font-weight: 800; font-size: 17px; position: relative; }
  .dcell small { font-size: 10px; font-weight: 700; color: var(--muted); }
  .dcell.done { background: var(--accent); color: #fff; } .dcell.done small { color: rgba(255,255,255,.8); }
  .dcell.today { outline: 2.5px solid var(--accent); outline-offset: 2px; }
  .drow { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 13px 2px; border-top: 1px solid var(--line); width: 100%; text-align: left; }
  .drow:first-of-type { border-top: 0; }
  .seg { display: flex; background: var(--surface2); border-radius: 11px; padding: 3px; gap: 3px; margin: 12px 0; }
  .seg button { flex: 1; min-height: 32px; border-radius: 8px; font-size: 14px; font-weight: 650; color: var(--muted); }
  .seg button.on { background: var(--surface); color: var(--text); box-shadow: 0 1px 3px rgba(0,0,0,.08); }
  .search input { width: 100%; height: 44px; border-radius: 12px; border: 0; background: var(--surface); padding: 0 14px; font-size: 16px; box-shadow: var(--shadow); outline: none; }

  /* DAY 화면 */
  .subtop { display: flex; justify-content: space-between; align-items: center; min-height: 40px; }
  .back { color: var(--accent); font-weight: 600; font-size: 16px; }
  .sec-h { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
  .fam { padding: 14px 0; border-top: 1px solid var(--line); }
  .fam:first-of-type { border-top: 0; }
  .wrow { display: flex; gap: 10px; align-items: flex-start; border-radius: 12px; padding: 6px 8px; margin: 0 -8px; transition: background .2s; }
  .wrow .t { flex: 1; min-width: 0; }
  .wrow .w { font-size: 21px; font-weight: 750; letter-spacing: -.01em; }
  .wrow.sub .w { font-size: 16px; font-weight: 650; }
  .wrow.sub { margin-left: 10px; padding-left: 14px; border-left: 2px solid var(--line); border-radius: 0 12px 12px 0; }
  .means { margin-top: 3px; font-size: 15px; line-height: 1.55; transition: filter .2s; }
  .wrow.sub .means { font-size: 14px; }
  .pos { display: inline-block; font-size: 11px; font-weight: 800; color: var(--accent); background: var(--accent-soft); border-radius: 5px; padding: 1px 5px; margin-right: 4px; vertical-align: 1px; }
  .exs { margin-top: 6px; font-size: 14.5px; line-height: 1.5; }
  .exs .ko { color: var(--muted); font-size: 13px; }
  mark { background: none; color: var(--accent); font-weight: 750; }
  .hide-m .wrow:not(.revealed) .means, .hide-m .wrow:not(.revealed) .exs .ko { filter: blur(6px); }
  .ex-play { display: inline-flex; vertical-align: -3px; margin-left: 4px; width: 22px; height: 22px; border-radius: 50%; background: var(--surface2); color: var(--muted); align-items: center; justify-content: center; }
  .ex-play svg { width: 10px; height: 10px; margin-left: 1px; }
  .actions { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin: 16px 0 8px; }
  .actions .wide { grid-column: 1 / -1; }

  /* 카드 */
  .qtop { display: flex; align-items: center; gap: 12px; margin: 6px 0 4px; }
  .qbar { flex: 1; height: 6px; border-radius: 3px; background: var(--surface2); overflow: hidden; }
  .qbar i { display: block; height: 100%; background: var(--accent); }
  .qnum { font-size: 14px; font-weight: 700; color: var(--muted); font-variant-numeric: tabular-nums; }
  .fc { min-height: 340px; display: flex; flex-direction: column; justify-content: center; text-align: center; padding: 26px 20px; }
  .fc .pl { font-size: 13px; font-weight: 700; color: var(--muted); }
  .fc .fw { font-size: 38px; font-weight: 800; letter-spacing: -.02em; margin-top: 10px; }
  .fc .fm { font-size: 19px; font-weight: 600; line-height: 1.55; margin-top: 12px; }
  .fc .back { border-top: 1px dashed var(--line); margin-top: 18px; padding-top: 18px; text-align: left; color: var(--text); font-weight: 400; }
  .fc .play { margin: 16px auto 0; }
  .grade { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
  .grade button { min-height: 54px; border-radius: 14px; font-weight: 750; font-size: 16px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; }
  .grade button small { font-size: 11px; font-weight: 600; opacity: .75; }
  .g-again { background: var(--red-soft); color: var(--red); } .g-hard { background: var(--amber-soft); color: var(--amber); } .g-good { background: var(--green-soft); color: var(--green); }
  .boxes { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-top: 12px; text-align: center; }
  .boxes div { background: var(--surface2); border-radius: 12px; padding: 10px 4px; }
  .boxes b { display: block; font-size: 20px; } .boxes span { font-size: 12px; color: var(--muted); font-weight: 600; }

  /* 테스트 */
  .field { display: flex; flex-direction: column; gap: 6px; font-size: 13px; font-weight: 600; color: var(--muted); margin-top: 12px; }
  .field select { height: 44px; border-radius: 12px; border: 0; background: var(--surface2); padding: 0 12px; font-size: 16px; color: var(--text); }
  .checks { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 12px; }
  .ck { display: flex; align-items: center; gap: 8px; background: var(--surface2); border-radius: 12px; padding: 11px 12px; font-size: 14px; font-weight: 600; }
  .ck input { width: 18px; height: 18px; accent-color: var(--accent); margin: 0; }
  .qcard { padding: 20px 18px; }
  .qkind { font-size: 13px; color: var(--accent); font-weight: 750; }
  .qprompt { font-size: 30px; font-weight: 800; margin: 10px 0 18px; letter-spacing: -.01em; display: flex; align-items: center; gap: 12px; }
  .qprompt.ko { font-size: 19px; font-weight: 650; line-height: 1.55; display: block; }
  .qsent { font-size: 18px; line-height: 2.1; margin: 4px 0 6px; }
  .qsent-ko { color: var(--muted); font-size: 14px; margin-bottom: 14px; }
  .opts { display: grid; gap: 10px; }
  .opt { text-align: left; padding: 14px 16px; border-radius: 14px; background: var(--surface2); font-size: 16px; line-height: 1.45; border: 2px solid transparent; width: 100%; }
  .opt.correct { border-color: var(--green); background: var(--green-soft); }
  .opt.wrong { border-color: var(--red); background: var(--red-soft); }
  input.spell { width: 100%; height: 52px; font-size: 22px; font-weight: 650; border: 0; border-bottom: 2.5px solid var(--accent); background: var(--accent-soft); border-radius: 10px 10px 0 0; padding: 0 12px; outline: none; letter-spacing: .02em; }
  input.blank { font-size: 17px; border: 0; border-bottom: 2px solid var(--accent); background: var(--accent-soft); border-radius: 7px 7px 0 0; padding: 3px 6px; margin: 0 2px; min-width: 6ch; outline: none; }
  input.ok { border-color: var(--green); background: var(--green-soft); } input.bad { border-color: var(--red); background: var(--red-soft); }
  .hintline { font-size: 13px; color: var(--muted); margin-top: 8px; }
  .fb { margin-top: 16px; padding: 14px; border-radius: 14px; display: flex; gap: 12px; align-items: center; }
  .fb.ok { background: var(--green-soft); } .fb.bad { background: var(--red-soft); }
  .fb > div { flex: 1; }
  .fb .t { font-weight: 800; font-size: 15px; } .fb.ok .t { color: var(--green); } .fb.bad .t { color: var(--red); }
  .fb .a { font-size: 17px; font-weight: 700; margin-top: 3px; } .fb .m { font-size: 14px; color: var(--muted); margin-top: 2px; line-height: 1.5; }
  .result { text-align: center; padding: 26px 16px; }
  .score { font-size: 56px; font-weight: 850; letter-spacing: -.03em; } .score small { font-size: 22px; color: var(--muted); }
  .wrong-item { display: flex; gap: 12px; align-items: center; padding: 12px 0; border-top: 1px solid var(--line); }
  .wrong-item .t { flex: 1; } .wrong-item .w { font-weight: 750; font-size: 17px; } .wrong-item .m { color: var(--muted); font-size: 14px; }
  .pnav { display: flex; gap: 8px; margin: 18px 0 8px; } .pnav .grow { flex: 1; }

  /* 설정 */
  .set-row { display: flex; justify-content: space-between; align-items: center; gap: 12px; padding: 13px 0; border-top: 1px solid var(--line); font-size: 16px; }
  .set-row:first-of-type { border-top: 0; }
  .set-row .seg { margin: 0; min-width: 170px; }
  .set-row select { max-width: 190px; height: 36px; border-radius: 10px; border: 0; background: var(--surface2); padding: 0 8px; font-size: 15px; color: var(--text); }
  .set-row input[type=range] { width: 150px; accent-color: var(--accent); }
  .set-sub { font-size: 13px; color: var(--muted); margin-top: 2px; }
  .sw { appearance: none; -webkit-appearance: none; width: 51px; height: 31px; border-radius: 16px; background: var(--surface2); position: relative; transition: background .2s; flex-shrink: 0; margin: 0; }
  .sw::after { content: ""; position: absolute; top: 2px; left: 2px; width: 27px; height: 27px; border-radius: 50%; background: #fff; box-shadow: 0 1px 3px rgba(0,0,0,.25); transition: transform .2s; }
  .sw:checked { background: var(--green); } .sw:checked::after { transform: translateX(20px); }

  .onboard { text-align: center; padding: 40px 8px; }
  .onboard img { width: 92px; height: 92px; border-radius: 22px; box-shadow: var(--shadow); }
  .onboard p { line-height: 1.65; color: var(--muted); }
  .steps { text-align: left; margin: 20px 0; display: grid; gap: 10px; }
  .steps div { display: flex; gap: 10px; align-items: flex-start; font-size: 15px; line-height: 1.5; }
  .steps b { width: 24px; height: 24px; border-radius: 50%; background: var(--accent); color: #fff; display: grid; place-items: center; font-size: 13px; flex-shrink: 0; }

  #tabs { position: fixed; left: 0; right: 0; bottom: 0; height: calc(var(--tabh) + env(safe-area-inset-bottom)); padding-bottom: env(safe-area-inset-bottom); background: var(--surface); border-top: 1px solid var(--line); display: flex; z-index: 20; }
  @supports (backdrop-filter: blur(1px)) or (-webkit-backdrop-filter: blur(1px)) {
    #tabs { background: color-mix(in srgb, var(--surface) 82%, transparent); backdrop-filter: blur(18px); -webkit-backdrop-filter: blur(18px); }
  }
  #tabs a { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; font-size: 11px; font-weight: 650; color: var(--muted); position: relative; }
  #tabs a.on { color: var(--accent); }
  #tabs svg { width: 24px; height: 24px; }
  #tabs .badge { position: absolute; top: 6px; left: calc(50% + 6px); background: var(--red); color: #fff; font-size: 10px; font-weight: 800; border-radius: 999px; min-width: 17px; height: 17px; padding: 0 4px; display: grid; place-items: center; }
  #tabs .badge[hidden] { display: none; }
  .no-tabs #tabs { display: none; }
  #player { position: fixed; left: 12px; right: 12px; bottom: calc(var(--tabh) + env(safe-area-inset-bottom) + 10px); max-width: 616px; margin: 0 auto; background: var(--text); color: var(--bg); border-radius: 15px; padding: 8px 8px 8px 14px; display: flex; align-items: center; gap: 10px; z-index: 30; box-shadow: 0 8px 26px rgba(0,0,0,.25); }
  #player[hidden] { display: none; }
  #playerText { flex: 1; font-size: 14px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  #player button { height: 36px; padding: 0 14px; border-radius: 10px; background: color-mix(in srgb, var(--bg) 18%, transparent); font-weight: 700; font-size: 14px; }
  #toast { position: fixed; left: 50%; bottom: calc(var(--tabh) + env(safe-area-inset-bottom) + 22px); transform: translateX(-50%); background: var(--text); color: var(--bg); padding: 10px 16px; border-radius: 999px; font-size: 14px; font-weight: 600; opacity: 0; transition: opacity .2s; pointer-events: none; z-index: 40; white-space: nowrap; }
  #toast.show { opacity: 1; }
</style>
</head>
<body>
<div id="app"></div>
<div id="player" hidden><div id="playerText"></div><button id="playerStop">정지</button></div>
<div id="toast"></div>
<nav id="tabs">
  <a href="#/" data-tab="today"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 10.5 12 3l9 7.5V20a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/></svg>오늘</a>
  <a href="#/days" data-tab="days"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="17" rx="2"/><path d="M3 9h18M8 2v4M16 2v4"/></svg>단어</a>
  <a href="#/review" data-tab="review"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 0 1 15.5-6.2L21 8"/><path d="M21 3v5h-5"/><path d="M21 12a9 9 0 0 1-15.5 6.2L3 16"/><path d="M3 21v-5h5"/></svg>복습<span class="badge" id="dueBadge" hidden></span></a>
  <a href="#/quiz" data-tab="quiz"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="m9 11 3 3 8-8"/><path d="M20 12v7a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h9"/></svg>테스트</a>
  <a href="#/settings" data-tab="settings"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 21v-7M4 10V3M12 21v-9M12 8V3M20 21v-5M20 12V3M1 14h6M9 8h6M17 16h6"/></svg>설정</a>
</nav>

<script>
(() => {
'use strict';
// ================= 기본 도구 =================
const $ = (s, el = document) => el.querySelector(s);
const $$ = (s, el = document) => [...el.querySelectorAll(s)];
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const pad2 = (n) => String(n).padStart(2, '0');
const shuffle = (a) => { for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const pick = (a) => a[Math.floor(Math.random() * a.length)];
const sleep = (ms) => new Promise((r) => setTimeout(r, ms));
const app = $('#app');
const ICON = {
  play: '<svg viewBox="0 0 24 24"><path fill="currentColor" d="M8 5.6v12.8a1 1 0 0 0 1.52.85l10.4-6.4a1 1 0 0 0 0-1.7L9.52 4.75A1 1 0 0 0 8 5.6z"/></svg>',
  star: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"><path d="m12 3 2.7 5.6 6.1.9-4.4 4.3 1 6.1L12 17l-5.4 2.9 1-6.1-4.4-4.3 6.1-.9z"/></svg>',
  starOn: '<svg viewBox="0 0 24 24" fill="currentColor"><path d="m12 3 2.7 5.6 6.1.9-4.4 4.3 1 6.1L12 17l-5.4 2.9 1-6.1-4.4-4.3 6.1-.9z"/></svg>',
};
const LS = {
  get(k, d) { try { const v = localStorage.getItem('ev.' + k); return v == null ? d : JSON.parse(v); } catch { return d; } },
  set(k, v) { try { localStorage.setItem('ev.' + k, JSON.stringify(v)); return true; } catch { return false; } },
};
// 책 데이터(약 1MB)는 IndexedDB에 둔다 (같은 주소의 다른 앱과 localStorage 용량을 나눠 쓰지 않게)

  async get(k) { const db = await this.open(); return new Promise((res) => { const q = db.transaction('kv').objectStore('kv').get(k); q.onsuccess = () => res(q.result ?? null); q.onerror = () => res(null); }); },
  async set(k, v) { const db = await this.open(); return new Promise((res) => { const t = db.transaction('kv', 'readwrite'); t.objectStore('kv').put(v, k); t.oncomplete = () => res(true); t.onerror = () => res(false); }); },
};

function indexBook() {
  const byId = new Map(), dayOf = new Map();
  for (const d of BOOK.days) for (const w of d.words) { byId.set(w.id, w); dayOf.set(w.id, d.day); }
  (BOOK.confusing || []).forEach((s, k) => s.words.forEach((w) => { byId.set(w.id, w); dayOf.set(w.id, 'c' + (k + 1)); }));

// 뜻 표시: "[명] 1. 진보, 발전 2. 진전" → 품사 배지 + 본문, 짧은 뜻 = 첫 번째 뜻
const posSplit = (m) => { const x = m.match(/^\[([^\]]+)\]\s*(.*)$/); return x ? [x[1], x[2]] : ['', m]; };
const meanHTML = (w) => w.m.map((m) => { const [p, t] = posSplit(m); return `<div>${p ? `<span class="pos">${esc(p)}</span>` : ''}${esc(t)}</div>`; }).join('');
const shortMean = (w) => { const [p, t] = posSplit(w.m[0] || ''); return (t.replace(/^1\.\s*/, '').split(/\s\d+\.\s/)[0] || t).trim(); };
const meanLine = (w) => w.m.map((m) => { const [p, t] = posSplit(m); return (p ? `[${p}] ` : '') + t; }).join(' / ');

function markDay() { P.days[today()] = true; save(); }
function streak() { let n = 0, d = today(); if (!P.days[d]) d = addDays(d, -1); while (P.days[d]) { n++; d = addDays(d, -1); } return n; }
function todayDays() {
  const t = today(), per = P.settings.perDay;
  if (!P.daily || P.daily.date !== t || P.daily.per !== per) {
    const keep = P.daily && P.daily.date === t ? P.daily.list.filter((n) => P.dayDone[n] === t) : [];
    const list = [...keep];
    for (let n = 1; n <= IDX.nDays && list.length < Math.max(per, keep.length); n++) if (!P.dayDone[n] && !list.includes(n)) list.push(n);
    P.daily = { date: t, per, list }; save();
  }
  return P.daily.list;
}
const firstUndoneDay = () => { for (let n = 1; n <= IDX.nDays; n++) if (!P.dayDone[n]) return n; return null; };

const INTERVALS = [1, 2, 4, 7, 15, 30, 60];

function gradeCard(id, g) {
  const t = today(), c = P.cards[id] || (P.cards[id] = { box: 0, due: t });
  if (g === 'again') { c.box = 0; c.due = addDays(t, 1); }
  else if (g === 'hard') { c.box = Math.max(0, c.box - 1); c.due = addDays(t, 1); }
  else { c.box = Math.min(c.box + 1, INTERVALS.length - 1); c.due = addDays(t, INTERVALS[c.box]); }
}
function toggleDayDone(n) {
  if (P.dayDone[n]) { delete P.dayDone[n]; save(); return false; }

// 단어: 클래스카드의 원어민 발음 MP3 / 예문·뜻: 아이폰 음성
const TTS = (() => {
  const synth = window.speechSynthesis; let voices = [], listeners = [];
  const load = () => { const n = voices.length; voices = synth ? synth.getVoices() : []; if (voices.length !== n) listeners.forEach((f) => f()); };
  if (synth) { load(); if ('onvoiceschanged' in synth) synth.onvoiceschanged = load; let k = 0; const p = setInterval(() => { load(); if (voices.length || ++k > 20) clearInterval(p); }, 500); }
  const ranked = () => { const all = voices.filter((v) => /^en[-_]/i.test(v.lang)), us = all.filter((v) => /en[-_]US/i.test(v.lang)); return [...new Set([...us.filter((v) => /premium|enhanced|samantha|ava|allison|evan|zoe|nathan|google us/i.test(v.name)), ...us, ...all])]; };
  const voice = (name) => (name === '__system' ? null : ranked().find((v) => v.name === name) || ranked()[0] || null);
  const ko = () => voices.find((v) => /^ko/i.test(v.lang)) || null;
  function speak(text, lang, v, rate) {
    return new Promise((res) => {
      if (!synth) return res();
      const u = new SpeechSynthesisUtterance(text); u.lang = v?.lang || lang; if (v) u.voice = v; u.rate = rate;
      let fin = false; const done = () => { if (!fin) { fin = true; clearTimeout(tm); load(); res(); } };
      u.onend = done; u.onerror = done; const tm = setTimeout(done, 3000 + (text.length * 110) / rate);
      synth.speak(u);
    });
  }
  return { speak, cancel: () => synth && synth.cancel(), ranked, voice, ko, refresh: load, onChange: (f) => listeners.push(f), get ok() { return !!synth; } };
})();
const CLIP = (() => {
  const a = new Audio(); a.preload = 'auto'; a.setAttribute('playsinline', '');
  let token = 0;
  function play(url) {
    const my = ++token;
    a.src = url; a.playbackRate = 1;
    const started = a.play();       // iOS: 탭 안에서 바로 play()
    return new Promise((res) => {
      const fin = (r) => { a.onended = a.onerror = null; clearTimeout(tm); res(my === token ? r : 'stopped'); };
      const tm = setTimeout(() => fin('ok'), 8000);
      a.onended = () => fin('ok'); a.onerror = () => fin('fail');
      started.catch(() => fin('fail'));
    });
  }
  return { play, stop() { token++; a.pause(); } };
})();

const wordItem = (w, el, extra = {}) => ({ audio: w.au, text: w.w, lang: 'en-US', el, ...extra });
const enTTS = (text, el, extra = {}) => ({ text, lang: 'en-US', el, ...extra });
const koTTS = (text, el, extra = {}) => ({ text, lang: 'ko-KR', el, ko: true, ...extra });
let seq = 0;
async function playItems(items) {
  stopAudio(false);
  const my = ++seq, clear = () => $$('.playing').forEach((e) => e.classList.remove('playing'));
  if (items.length > 1) $('#player').hidden = false;
  for (const it of items) {
    if (my !== seq) return;
    clear(); it.el?.classList.add('playing'); $('#playerText').textContent = it.text;
    if (items.length > 1) it.el?.scrollIntoView({ block: 'nearest', behavior: 'smooth' });
    const r = it.audio ? await CLIP.play(it.audio) : 'fail';
    if (r === 'fail' && my === seq) await TTS.speak(it.text, it.lang, it.ko ? TTS.ko() : TTS.voice(P.settings.voiceA), it.ko ? Math.min(1.15, P.settings.rate + 0.15) : P.settings.rate);
    if (my !== seq) return;
    await sleep(it.pause ?? 200);
  }
  if (my === seq) { clear(); $('#player').hidden = true; }
}

  if (!QZ.saved) {
    QZ.saved = true;
    for (const r of R) { if (r.ok) delete P.wrong[r.q.id]; else { P.wrong[r.q.id] = (P.wrong[r.q.id] || 0) + 1; gradeCard(r.q.id, 'again'); } }
    if (QZ.meta.day) P.tests[QZ.meta.day] = Math.max(P.tests[QZ.meta.day] ?? 0, score);
    markDay();
  }
  const wrong = R.filter((r) => !r.ok); QZ.wrongList = wrong;
  app.innerHTML = `
    <section class="card result"><div class="label">${esc(QZ.title)}</div><div class="score">${ok}<small>/${n}</small></div><div style="font-weight:700;font-size:18px">${score === 100 ? '완벽해요!' : score >= 80 ? '잘했어요!' : score >= 50 ? '조금만 더!' : '복습하고 다시 도전해요'}</div></section>
    ${wrong.length ? `<section class="card"><h2>틀린 단어</h2>${wrong.map((r, i) => `<div class="wrong-item"><div class="t"><div class="w">${esc(r.q.w.w)}</div><div class="m">${esc(meanLine(r.q.w))}</div></div><button class="play sm" data-act="resSay" data-i="${i}" aria-label="발음">${ICON.play}</button></div>`).join('')}</section>` : ''}
    <div class="pnav">${wrong.length ? '<button class="btn primary grow" data-act="retryWrong">틀린 것만 다시</button>' : ''}<a class="btn grow" href="#/quiz">테스트 홈</a></div>`;
}
ACT.resSay = (el) => sayWord(QZ.wrongList[+el.dataset.i].q.w);
ACT.retryWrong = () => { const qs = QZ.wrongList.map((r) => makeQ(r.q.id, P.settings.quiz.types) || r.q); startQuiz(shuffle(qs), QZ.title + ' · 다시', {}); };

// ================= 설정 =================
function viewSettings() {
  const s = P.settings, voices = TTS.ranked();
  const cur = s.voiceA === '__system' ? '__system' : TTS.voice(s.voiceA)?.name || '';
  app.innerHTML = `
    <header class="top"><h1>설정</h1></header>
    <section class="card"><h2>학습</h2>
      <div class="set-row" style="border-top:0"><span>하루 DAY 수</span><div class="seg">${[1, 2, 3].map((n) => `<button data-act="setPer" data-n="${n}" class="${s.perDay === n ? 'on' : ''}">${n}</button>`).join('')}</div></div>
      <div class="set-row"><div><div>파생어도 외우기·복습</div><div class="set-sub">끄면 표제어만 카드·복습·테스트에 나와요</div></div><input type="checkbox" class="sw" data-set="withDeriv" ${s.withDeriv ? 'checked' : ''}></div>
      <div class="set-row"><div><div>자동으로 발음 듣기</div><div class="set-sub">카드·테스트에서 단어가 나올 때</div></div><input type="checkbox" class="sw" data-set="autoplay" ${s.autoplay ? 'checked' : ''}></div>
    </section>
    <section class="card"><h2>소리</h2>
      <div class="set-row" style="border-top:0"><div><div>단어 발음</div><div class="set-sub">원어민 녹음 (인터넷 필요, 안 되면 아이폰 음성)</div></div></div>
      <div class="set-row"><div><div>전체 듣기에서 뜻도 읽기</div><div class="set-sub">단어 → 한국어 뜻 순서로</div></div><input type="checkbox" class="sw" data-set="readMean" ${s.readMean ? 'checked' : ''}></div>
      <div class="set-row"><span>예문 목소리</span><select id="voiceA"><option value="__system" ${cur === '__system' ? 'selected' : ''}>아이폰 기본 목소리</option>${voices.map((v) => `<option value="${esc(v.name)}" ${cur === v.name ? 'selected' : ''}>${esc(v.name)} (${esc(v.lang)})</option>`).join('')}</select></div>
      <div class="set-row"><span>예문 속도 <b id="rateV">${s.rate.toFixed(2)}</b></span><input type="range" min="0.6" max="1.2" step="0.05" value="${s.rate}" id="rate"></div>
    </section>
    <section class="card"><h2>데이터</h2>
      <div class="set-row" style="border-top:0"><span>단어 데이터</span><span class="muted">DAY ${IDX.nDays}개 · ${IDX.byId.size}단어</span></div>
      <div class="set-row"><span>학습 기록</span><span class="muted">완료 ${Object.keys(P.dayDone).length} DAY · 카드 ${Object.keys(P.cards).length}</span></div>
      <label class="btn block">단어 데이터 다시 불러오기<input type="file" id="reimport" accept=".json,application/json" hidden></label>
      <button class="btn block danger" data-act="resetProgress">학습 기록 초기화</button>
      <p class="hint">출처: ${esc(BOOK.source || '')} · 기록은 이 기기의 이 앱 안에만 저장됩니다.</p>
    </section>`;
  $$('[data-set]').forEach((c) => (c.onchange = () => { s[c.dataset.set] = c.checked; save(); }));
  $('#voiceA').onchange = (e) => { s.voiceA = e.target.value; save(); playItems([enTTS('This is how example sentences will sound.', null)]); };
  $('#rate').oninput = (e) => { s.rate = +e.target.value; $('#rateV').textContent = s.rate.toFixed(2); save(); };
  $('#reimport').onchange = (e) => importFile(e.target.files[0]);
}
TTS.onChange(() => { if (location.hash === '#/settings' && BOOK) viewSettings(); });
ACT.setPer = (el) => { P.settings.perDay = +el.dataset.n; save(); $$('[data-act="setPer"]').forEach((b) => b.classList.toggle('on', b === el)); };
ACT.resetProgress = () => {
  if (!confirm('학습 완료 표시, 복습 카드, 오답 노트, 별표, 연속 학습 기록을 모두 지울까요? 되돌릴 수 없습니다.')) return;
  const settings = P.settings; P = { dayDone: {}, cards: {}, wrong: {}, days: {}, tests: {}, fav: {}, daily: null, settings }; save(); toast('학습 기록을 초기화했습니다'); go('#/');
};

// ================= 시작 =================
(async () => {
  try { const d = await IDB.get('book'); if (validBook(d)) { BOOK = d; indexBook(); } } catch {}
  route();
})();
if ('serviceWorker' in navigator && location.protocol.startsWith('http')) navigator.serviceWorker.register('sw.js').catch(() => {});
})();
</script>
</body>
</html>
